# PgBouncer Configuration for Reframe Platform
# Production-ready connection pooling

[databases]
reframe = host=localhost port=5432 dbname=reframe

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Pool modes: session, transaction, statement
# transaction = recommended for SaaS (releases connection after each transaction)
pool_mode = transaction

# Connection pool settings
min_pool_size = 5
default_pool_size = 20
max_pool_size = 100
max_client_conn = 200

# Timeouts
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 3

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

# Performance
ignore_startup_parameters = extra_float_digits

# Security
admin_users = postgres