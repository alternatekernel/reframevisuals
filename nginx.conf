# Reframe Visual — nginx SPA Configuration
# Place this in your CloudPanel site's nginx vhost config
# CloudPanel path: /etc/nginx/sites-enabled/your-site.conf
# Or add via CloudPanel Dashboard → Sites → your site → Vhost

server {
    listen 80;
    listen [::]:80;
    server_name reframevisuals.com www.reframevisuals.com;

    # Redirect HTTP to HTTPS
    return 301 https://reframevisuals.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.reframevisuals.com;

    # SSL certificates (managed by CloudPanel/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/reframevisuals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reframevisuals.com/privkey.pem;

    # Enforce single canonical host.
    return 301 https://reframevisuals.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reframevisuals.com;

    # SSL certificates (managed by CloudPanel/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/reframevisuals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reframevisuals.com/privkey.pem;

    # Point to the built unified distribution folder
    root /home/reframe/htdocs/reframevisuals.com/dist;
    index index.html;

    # ────────────────────────────────────────────────
    # SPA routing fallback to Express backend for SEO injection
    #
    # Rendering architecture (static-cache-first, intentional):
    #   1. try_files serves build-time prerendered pages
    #      (dist/<route>/index.html) directly — the fast static cache.
    #   2. Routes without a prerendered file fall through to @backend, where
    #      Express server-side renders them per request with the Vite SSR
    #      bundle (frontend/dist-ssr) and injects SEO meta.
    #   3. If SSR fails, Express serves the SPA shell so the site never 500s.
    # ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ @backend;
    }

    # Proxy homepage through Express for server-side SEO meta injection
    location = / {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy llms.txt and llms-full.txt to Express for dynamic AI context generation
    location = /llms.txt {
        proxy_pass http://127.0.0.1:3001/llms.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms-full.txt {
        proxy_pass http://127.0.0.1:3001/llms-full.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicitly proxy robots.txt and sitemaps so they trigger dynamic Express generation
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3001/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @backend {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Hashed build output (content-addressed filenames) — safe to cache forever
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files (logo.svg, security-bootstrap.js, manifest, ...) are
    # NOT content-hashed, so cache for 7 days with revalidation instead of
    # marking them immutable.
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    # ────────────────────────────────────────────────
    # API PROXY → Backend on port 3001
    # ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Upload size limit (supports large image batch uploads)
    client_max_body_size 100m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # HSTS — forces HTTPS for 1 year, including subdomains (M14 fix)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy (M14 fix)
    # Allows scripts from self + Stripe + Google Fonts. Tighten 'unsafe-inline' once
    # the app migrates to nonce-based CSP in a future sprint.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.stripe.com https://ipapi.co wss:; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self';" always;
}
