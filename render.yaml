databases:
  - name: reframe-db
    databaseName: reframe
    user: reframe
    plan: free

services:
  - type: web
    name: reframe-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reframe-db
          property: externalConnectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
